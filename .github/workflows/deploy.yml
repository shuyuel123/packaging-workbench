name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages
        # 项目名 -n 指定；若同名项目不存在会自动创建
        run: npx edgeone makers deploy ./dist -n packaging-workbench -t ${{ secrets.EDGEONE_API_TOKEN }}
