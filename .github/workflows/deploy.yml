name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages
        id: deploy
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          output=$(npx edgeone makers deploy ./dist -n packaging-workbench -t "$EDGEONE_API_TOKEN" 2>&1)
          echo "$output"
          url=$(printf '%s\n' "$output" | grep 'EDGEONE_DEPLOY_URL=' | cut -d'=' -f2-)
          echo "url=${url:-$output}" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL on commit
        if: steps.deploy.outputs.url != ''
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            🚀 已部署到 EdgeOne Pages: ${{ steps.deploy.outputs.url }}
