name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages
        id: deploy
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PAGES_SOURCE: ci
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::缺少 EDGEONE_API_TOKEN secret，请到 Settings → Secrets and variables → Actions 添加后重跑"
            exit 1
          fi

          set +e
          output=$(npx --yes edgeone@latest makers deploy ./dist \
            -n packaging-workbench-app \
            -t "$EDGEONE_API_TOKEN" 2>&1)
          code=$?
          set -e

          # CLI 输出带 ANSI 颜色码，先剥离再解析
          clean=$(printf '%s\n' "$output" | sed -r 's/\x1B\[[0-9;]*[a-zA-Z]//g')
          printf '%s\n' "$clean"

          if [ "$code" -ne 0 ]; then
            echo "::error::EdgeOne 部署失败（exit=$code），详见上方 CLI 输出"
            exit "$code"
          fi

          url=$(printf '%s\n' "$clean" | sed -nE 's/.*Deploy URL:[[:space:]]*(https:[^[:space:]]+).*/\1/p' | head -n 1)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$clean" | sed -nE 's/.*EDGEONE_DEPLOY_URL=(https:[^[:space:]]+).*/\1/p' | head -n 1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL on commit
        if: steps.deploy.outputs.url != ''
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            🚀 已部署到 EdgeOne Pages: ${{ steps.deploy.outputs.url }}
